<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrokódica - Módulo 4: Ressonância Vibracional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #010204; color: #f8fafc; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .aura-bg {
            background: radial-gradient(circle at 50% 50%, #0a0f2b 0%, #010204 100%);
        }

        .frequency-bar {
            transition: height 0.1s ease-out, background-color 0.3s ease;
        }

        .orb-glow {
            filter: blur(40px);
            opacity: 0.3;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .twinkle {
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.6; }
        }

        /* Custom Scrollbar para o painel lateral caso o texto seja longo */
        .custom-scroll::-webkit-scrollbar {
            width: 3px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body class="aura-bg">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const FREQUENCIES = [
            { hz: 174, label: "Alívio", color: "from-blue-900 to-blue-700" },
            { hz: 396, label: "Libertação", color: "from-red-900 to-red-700" },
            { hz: 528, label: "DNA / Milagre", color: "from-emerald-900 to-emerald-700" },
            { hz: 639, label: "Conexão", color: "from-amber-900 to-amber-700" },
            { hz: 852, label: "Intuição", color: "from-purple-900 to-purple-700" }
        ];

        function App() {
            const [activeFreq, setActiveFreq] = useState(FREQUENCIES[2]);
            const [amplitude, setAmplitude] = useState(0.5);
            const [time, setTime] = useState(0);
            const [harmonics, setHarmonics] = useState([]);
            const [isAudioInit, setIsAudioInit] = useState(false);
            const [isMuted, setIsMuted] = useState(false);
            
            const audioCtx = useRef(null);
            const oscillator = useRef(null);
            const gainNode = useRef(null);

            const initAudio = () => {
                if (!audioCtx.current) {
                    audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
                    oscillator.current = audioCtx.current.createOscillator();
                    gainNode.current = audioCtx.current.createGain();
                    oscillator.current.type = 'sine';
                    oscillator.current.frequency.setValueAtTime(activeFreq.hz, audioCtx.current.currentTime);
                    gainNode.current.gain.setValueAtTime(0, audioCtx.current.currentTime);
                    oscillator.current.connect(gainNode.current);
                    gainNode.current.connect(audioCtx.current.destination);
                    oscillator.current.start();
                    setIsAudioInit(true);
                } else if (audioCtx.current.state === 'suspended') {
                    audioCtx.current.resume();
                }
            };

            const toggleMute = () => {
                if (!isAudioInit) initAudio();
                else setIsMuted(!isMuted);
            };

            useEffect(() => {
                if (isAudioInit && oscillator.current && gainNode.current) {
                    const now = audioCtx.current.currentTime;
                    oscillator.current.frequency.exponentialRampToValueAtTime(activeFreq.hz, now + 0.1);
                    const targetGain = isMuted ? 0 : (amplitude * 0.15);
                    gainNode.current.gain.linearRampToValueAtTime(targetGain, now + 0.1); 
                }
            }, [activeFreq, amplitude, isAudioInit, isMuted]);

            useEffect(() => {
                let frame;
                const animate = () => {
                    setTime(t => t + 0.05);
                    frame = requestAnimationFrame(animate);
                };
                frame = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(frame);
            }, []);

            useEffect(() => {
                const h = Array.from({ length: 40 }, (_, i) => ({
                    id: i,
                    offset: Math.random() * Math.PI * 2,
                    speed: 0.2 + Math.random() * 0.5,
                    heightMultiplier: 0.5 + Math.random() * 1.5
                }));
                setHarmonics(h);
            }, [activeFreq]);

            const points = useMemo(() => {
                let p = "";
                for (let x = 0; x <= 100; x += 1) {
                    const y = 50 + Math.sin(x * 0.2 + time) * (amplitude * 20);
                    p += `${x === 0 ? 'M' : 'L'} ${x} ${y} `;
                }
                return p;
            }, [time, amplitude]);

            return (
                <div className="h-screen w-full flex flex-col relative z-10 p-4 md:p-6 overflow-hidden">
                    
                    {/* Header */}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-4 bg-white/[0.02] border border-white/10 p-5 rounded-[2rem] backdrop-blur-3xl shrink-0 gap-4">
                        <div className="flex items-center gap-6">
                            <div className="relative cursor-pointer" onClick={toggleMute}>
                                <div className={`w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 orb-glow absolute ${isAudioInit && !isMuted ? 'animate-pulse' : 'opacity-20'}`}></div>
                                <div className={`w-12 h-12 rounded-2xl border-2 flex items-center justify-center relative z-10 bg-black/50 text-xl transition-all ${isAudioInit && !isMuted ? 'border-blue-500/50 text-blue-400' : 'border-white/20 text-white/40'}`}>
                                    {isAudioInit ? (isMuted ? '🔇' : '🔊') : 'Ω'}
                                </div>
                            </div>
                            <div>
                                <h1 className="text-xl font-black tracking-tighter text-white flex items-center gap-3 uppercase">
                                    Módulo_04
                                    <span className="text-[10px] bg-white/10 px-3 py-1 rounded-full font-mono font-normal tracking-widest text-blue-400">RESSONÂNCIA</span>
                                </h1>
                                <p className="text-[9px] font-mono text-slate-500 tracking-[0.4em] uppercase mt-1">Sincronização Bio-Digital</p>
                            </div>
                        </div>

                        <div className="flex flex-wrap justify-center gap-2">
                            {FREQUENCIES.map(f => (
                                <button 
                                    key={f.hz}
                                    onClick={() => { setActiveFreq(f); if (!isAudioInit) initAudio(); }}
                                    className={`px-3 py-2 rounded-xl text-[10px] font-mono transition-all border ${activeFreq.hz === f.hz ? 'bg-white/10 border-white/20 text-white shadow-lg' : 'border-transparent text-slate-600 hover:text-slate-400'}`}
                                >
                                    {f.hz}Hz
                                </button>
                            ))}
                        </div>
                    </header>

                    {/* Área Principal com Espaçamento para o Footer */}
                    <div className="flex-1 flex flex-col md:flex-row gap-6 min-h-0 pb-2"> 
                        
                        {/* Painel Lateral */}
                        <aside className="w-full md:w-80 flex flex-col shrink-0 min-h-0">
                            <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] flex-1 flex flex-col min-h-0 overflow-y-auto custom-scroll">
                                <h3 className="text-[10px] font-mono text-blue-400 uppercase tracking-widest mb-6 flex items-center gap-3">
                                    <span className="w-4 h-[1px] bg-blue-500"></span>
                                    Oscilador
                                </h3>

                                <div className="space-y-6">
                                    <div className="group">
                                        <div className="flex justify-between text-[10px] font-mono text-slate-500 mb-3 uppercase tracking-tighter">
                                            <span>Amplitude_Vibracional</span>
                                            <span className="text-blue-400 font-bold">{(amplitude * 100).toFixed(0)}%</span>
                                        </div>
                                        <input 
                                            type="range" min="0" max="1" step="0.01" 
                                            value={amplitude} 
                                            onChange={(e) => setAmplitude(parseFloat(e.target.value))}
                                            className="w-full h-1 bg-white/10 appearance-none rounded-full accent-blue-500"
                                        />
                                    </div>

                                    {!isAudioInit ? (
                                        <button onClick={initAudio} className="w-full p-4 bg-blue-500/10 border border-blue-500/20 rounded-2xl text-[10px] text-blue-400 font-mono uppercase tracking-widest animate-pulse">
                                            Ativar Áudio
                                        </button>
                                    ) : (
                                        <button onClick={toggleMute} className={`w-full py-3 rounded-2xl font-mono text-[9px] uppercase tracking-widest border transition-all ${isMuted ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-blue-500/10 border-blue-500/30 text-blue-400'}`}>
                                            {isMuted ? 'Restaurar' : 'Silenciar'}
                                        </button>
                                    )}

                                    {/* Informação da Frequência - Aqui é onde a sobreposição era crítica */}
                                    <div className="p-5 bg-white/[0.03] border border-white/5 rounded-3xl space-y-3">
                                        <div className="flex justify-between items-end">
                                            <span className="text-[9px] text-slate-500 font-mono uppercase">Modo_Atual</span>
                                            <span className="text-xs font-bold text-white uppercase italic">{activeFreq.label}</span>
                                        </div>
                                        <div className={`h-1.5 w-full bg-gradient-to-r ${activeFreq.color} rounded-full`}></div>
                                        <p className="text-[10px] text-slate-400 leading-relaxed italic">
                                            A frequência de {activeFreq.hz}Hz estabiliza o fluxo de dados na rede neural, criando um ambiente de ressonância harmónica.
                                        </p>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="p-3 bg-white/5 rounded-2xl border border-white/5">
                                            <p className="text-[8px] text-slate-500 uppercase mb-1">Coerência</p>
                                            <p className="text-xs font-bold">0.998</p>
                                        </div>
                                        <div className="p-3 bg-white/5 rounded-2xl border border-white/5">
                                            <p className="text-[8px] text-slate-500 uppercase mb-1">Status</p>
                                            <p className={`text-[10px] font-bold ${isAudioInit && !isMuted ? 'text-emerald-400' : 'text-slate-600'}`}>
                                                {isAudioInit && !isMuted ? 'ATIVA' : 'IDLE'}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </aside>

                        {/* Visualizador Central */}
                        <main className="flex-1 relative glass-panel rounded-[3rem] overflow-hidden group min-h-0">
                            <div className="absolute inset-0 z-0">
                                {[...Array(15)].map((_, i) => (
                                    <div key={i} className="absolute w-1 h-1 bg-blue-500/20 rounded-full twinkle" style={{ top: `${Math.random() * 100}%`, left: `${Math.random() * 100}%`, animationDelay: `${Math.random() * 5}s` }}></div>
                                ))}
                            </div>

                            <svg className="w-full h-full relative z-10" viewBox="0 0 100 100" preserveAspectRatio="none">
                                <defs>
                                    <linearGradient id="waveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
                                        <stop offset="0%" stopColor="rgba(59, 130, 246, 0)" />
                                        <stop offset="50%" stopColor="rgba(59, 130, 246, 0.8)" />
                                        <stop offset="100%" stopColor="rgba(59, 130, 246, 0)" />
                                    </linearGradient>
                                </defs>
                                <path d={points} fill="none" stroke="url(#waveGrad)" strokeWidth="0.8" className="drop-shadow-[0_0_8px_rgba(59,130,246,0.5)]"/>
                                <path d={points.replace(/L (\d+) (\d+\.?\d*)/g, (m, x, y) => `L ${x} ${100 - parseFloat(y)}`).replace(/M (\d+) (\d+\.?\d*)/, (m, x, y) => `M ${x} ${100 - parseFloat(y)}`)} fill="none" stroke="rgba(59, 130, 246, 0.1)" strokeWidth="0.2" />
                            </svg>

                            <div className="absolute inset-x-0 bottom-0 h-32 flex items-end justify-center gap-1 px-8 pb-12 z-0 opacity-40">
                                {harmonics.map((h, i) => (
                                    <div key={i} className="flex-1 frequency-bar rounded-t-full bg-gradient-to-t from-blue-900/20 to-blue-400/30" style={{ height: `${10 + Math.abs(Math.sin(time * h.speed + h.offset)) * (40 * h.heightMultiplier * amplitude)}%` }}></div>
                                ))}
                            </div>
                        </main>
                    </div>

                    {/* Footer - Ajustado para ser uma barra de status discreta e não obstrutiva */}
                    <footer className="mt-4 flex flex-col md:flex-row justify-between items-center px-8 py-4 glass-panel rounded-[2rem] shrink-0 z-20">
                        <div className="flex flex-wrap justify-center md:justify-start gap-8 md:gap-12">
                            <div className="flex flex-col">
                                <span className="text-[7px] text-slate-600 uppercase font-mono mb-0.5 tracking-widest">Sincronia Afrokódica</span>
                                <span className="text-[9px] text-white/80 font-bold uppercase tracking-widest italic">ESTADO_DE_FLUXO</span>
                            </div>
                            <div className="flex flex-col">
                                <span className="text-[7px] text-slate-600 uppercase font-mono mb-0.5 tracking-widest">Localização Dimensional</span>
                                <span className="text-[9px] text-blue-500 font-bold uppercase tracking-widest">Namibe_Frequency_Hub</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-4 mt-4 md:mt-0">
                            <div className="text-right">
                                <p className="text-[7px] text-slate-500 uppercase mb-0.5">Vibração de Campo</p>
                                <p className="text-[9px] text-emerald-400 font-mono font-bold italic uppercase">MEC-04_SINC</p>
                            </div>
                            <div className="w-1.5 h-6 bg-emerald-500/20 rounded-full flex items-end overflow-hidden">
                                <div className="w-full bg-emerald-500 rounded-full animate-pulse" style={{ height: isAudioInit && !isMuted ? '70%' : '10%' }}></div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
